# ===== upstream к Laravel/Octane (docker name)
upstream app {
    server laravel-app:8000;
    keepalive 64;
}

# ws/sse
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# если Traefik уже прислал X-Forwarded-*, не перезатираем
map $http_x_forwarded_proto $fproto {
    default $http_x_forwarded_proto;
    '' $scheme;
}
map $http_x_forwarded_host  $fhost  {
    default $http_x_forwarded_host;
    '' $host;
}
map $http_x_forwarded_port  $fport  {
    default $http_x_forwarded_port;
    '' $server_port;
}

# Разрешаем CORS только для витрины
map $http_origin $allow_origin {
    default                          "";
    "~^https://voiceleadai\.ru$"     $http_origin;
}

server {
  # Внутри контейнера слушаем 80 (Traefik шлёт сюда и на http, и на https-router после TLS)
  listen 80;
  server_name _;

  root /var/www/html/public;
  index index.php;
  client_max_body_size 50m;

  location ^~ /.well-known/acme-challenge/ {
      alias /var/www/letsencrypt/.well-known/acme-challenge/;
      default_type "text/plain";
      try_files $uri =404;
      # никаких редиректов, gzip и т.п.
  }

  # healthcheck
  location = /up { return 200; }

  # ===== ассеты (Vite, модули, шрифты) + CORS для витрины
  location ~* \.(?:css|js|mjs|map|woff2?|ttf|otf)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    if ($allow_origin != "") {
      add_header Access-Control-Allow-Origin $allow_origin always;
      add_header Vary "Origin" always;
      add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    }
  }

  # ===== изображения/иконки
  location ~* \.(?:png|jpe?g|gif|svg|webp|ico)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    # (обычно CORS не нужен, но включить можно по аналогии)
  }

  # ===== публичный storage
  location /storage/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=604800";
    if ($allow_origin != "") {
      add_header Access-Control-Allow-Origin $allow_origin always;
      add_header Vary "Origin" always;
    }
  }

  # ===== если хочется nginx-редирект именно с корня
  location = / {
    return 302 /landing;
  }

  # ===== остальное: сначала файл/директория (index.html), иначе — в приложение (Octane)
  location / {
    try_files $uri $uri/ @app;
  }

  location @app {
    proxy_pass http://app;

    proxy_http_version 1.1;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # сохраняем внешний хост/схему от Traefik (важно для генерации URL в Laravel)
    proxy_set_header Host                $fhost;
    proxy_set_header X-Forwarded-Host    $fhost;
    proxy_set_header X-Forwarded-Proto   $fproto;
    proxy_set_header X-Forwarded-Port    $fport;
    proxy_set_header X-Real-IP           $remote_addr;
    proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;

    proxy_set_header Upgrade             $http_upgrade;
    proxy_set_header Connection          $connection_upgrade;
    proxy_set_header Cookie              $http_cookie;
  }
}

gzip off;
sub_filter_once off;
sub_filter_types text/html text/css application/javascript application/json image/svg+xml;
sub_filter 'http://voice-lead-ai.ru' 'https://voiceleadai.ru';
sub_filter 'https://voice-lead-ai.ru' 'https://voiceleadai.ru';
